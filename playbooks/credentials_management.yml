---
# Credentials Management Playbook
# Demonstrates create/update, gather (all and by name), and delete operations
# for XSOAR 8 credential objects using the cortex.xsoar8.credential module.
#
# Supported parameters:
#   name        — unique credential name (required for present/absent)
#   username    — username for the credential
#   password    — secret/password value (write-only, not retrievable after creation)
#   certificate — SSH key or certificate value (write-only, not retrievable after creation)
#   workgroup   — workgroup to associate with the credential
#
# Idempotency note: only username and workgroup are compared for updates.
# Password and certificate changes alone do not trigger a reported change.
#
# Usage examples:
#   ansible-playbook playbooks/credentials_management.yml --tags create_az
#   ansible-playbook playbooks/credentials_management.yml --tags gather
#   ansible-playbook playbooks/credentials_management.yml --tags delete
#
# Adding --check to the command line will run the playbook in check mode, which will show what changes would be made without actually making them.

- name: XSOAR Credential Management
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../vars/xsoar.yml
  vars:
    xsoar_provider:
      server: "{{ server }}"
      api_key: "{{ api_key }}"
      api_key_id: "{{ api_key_id }}"
      # verify_ssl: true

  tasks:
    # -------------------------------------------------------------------------
    # CREATE / UPDATE
    # -------------------------------------------------------------------------

    - name: Create an Azure Sentinel credential
      cortex.xsoar8.credential:
        provider: "{{ xsoar_provider }}"
        name: "azure_sentinel_credential"
        username: "{{ azure_client_id | default('00000000-0000-0000-0000-000000000000') }}"
        password: "{{ azure_client_secret | default('changeme') }}"
        state: present
      register: azure_sentinel_cred
      tags:
        - create_az

    - name: Create a workgroup credential (e.g. Active Directory service account)
      cortex.xsoar8.credential:
        provider: "{{ xsoar_provider }}"
        name: "ad_service_account"
        username: "svc_xsoar"
        password: "{{ ad_password | default('changeme') }}"
        workgroup: "CORP"
        state: present
      register: ad_cred
      tags:
        - create_wc

    - name: Create an SSH key credential
      cortex.xsoar8.credential:
        provider: "{{ xsoar_provider }}"
        name: "deploy_ssh_key"
        username: "deploy_user"
        certificate: "dummy_certificate"
        state: present
      register: ssh_cred
      tags:
        - create_ssh

    - name: Display credential result
      ansible.builtin.debug:
        msg: |
          Changed : {{ azure_sentinel_cred.changed }}
          Name    : {{ azure_sentinel_cred.credential.name }}
          ID      : {{ azure_sentinel_cred.credential.id }}
          Message : {{ azure_sentinel_cred.msg }}
      tags:
        - create_az

    - name: Display workgroup credential result
      ansible.builtin.debug:
        msg: |
          Changed : {{ ad_cred.changed }}
          Name    : {{ ad_cred.credential.name }}
          ID      : {{ ad_cred.credential.id }}
          Message : {{ ad_cred.msg }}
      tags:
        - create_wc

    - name: Display SSH credential result
      ansible.builtin.debug:
        msg: |
          Changed : {{ ssh_cred.changed }}
          Name    : {{ ssh_cred.credential.name }}
          ID      : {{ ssh_cred.credential.id }}
          Message : {{ ssh_cred.msg }}
      tags:
        - create_ssh

    # -------------------------------------------------------------------------
    # GATHER — all credentials
    # -------------------------------------------------------------------------

    - name: Gather all credentials
      cortex.xsoar8.credential:
        provider: "{{ xsoar_provider }}"
        state: gathered
      register: all_creds
      tags:
        - gather_all

    - name: Display all credentials
      ansible.builtin.debug:
        msg: "Found {{ all_creds.credentials | default([]) | length }} credential(s)"
      tags:
        - gather_all

    # -------------------------------------------------------------------------
    # GATHER — single credential by name
    # -------------------------------------------------------------------------

    - name: Gather a specific credential by name
      cortex.xsoar8.credential:
        provider: "{{ xsoar_provider }}"
        name: "azure_sentinel_credential"
        state: gathered
      register: azure_sentinel_cred_info
      tags:
        - gather

    - name: Display specific credential
      ansible.builtin.debug:
        msg: |
          Name        : {{ azure_sentinel_cred_info.credential.name }}
          ID          : {{ azure_sentinel_cred_info.credential.id }}
          Username    : {{ azure_sentinel_cred_info.credential.user }}
          Has password: {{ azure_sentinel_cred_info.credential.hasPassword }}
      when: azure_sentinel_cred_info.credential is defined
      tags:
        - gather

    - name: Display gather result when credential is missing
      ansible.builtin.debug:
        msg: "{{ azure_sentinel_cred_info.msg | default('Credential details not available') }}"
      when: azure_sentinel_cred_info.credential is not defined
      tags:
        - gather

    # -------------------------------------------------------------------------
    # DELETE
    # -------------------------------------------------------------------------

    - name: Delete a credential by name
      cortex.xsoar8.credential:
        provider: "{{ xsoar_provider }}"
        name: "azure_sentinel_credential"
        state: absent
      register: delete_result
      tags:
        - delete

    - name: Display delete result
      ansible.builtin.debug:
        msg: "{{ delete_result.msg }}"
      tags:
        - delete

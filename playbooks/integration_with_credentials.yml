---
# Integration With Credentials Playbook
# Demonstrates creating an integration by referencing an existing
# credential object from XSOAR.
#
# Typical flow:
#   1) Create credential first:
#      ansible-playbook playbooks/credentials_management.yml --tags create_az \
#        -e "azure_client_id=<client-id>" -e "azure_client_secret=<secret>"
#   2) Create integration with credential reference:
#      ansible-playbook playbooks/integration_with_credentials.yml --tags create_azure
#
# Important:
#   The credential key inside configuration is integration-specific.
#   In this Azure Sentinel example it is "credentials", but other integrations
#   can use different keys such as "creds_apikey". Check the integration
#   settings in XSOAR (or run gathered/discovery first) before using this playbook.
#
# Optional overrides:
#   -e "azure_credential_name=azure_sentinel_credential"
#   -e "azure_integration_name=Azure_Sentinel_Prod"

- name: XSOAR Integration With Credentials
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../vars/xsoar.yml
  vars:
    xsoar_provider:
      server: "{{ server }}"
      api_key: "{{ api_key }}"
      api_key_id: "{{ api_key_id }}"
      # verify_ssl: true

  tasks:
    # -------------------------------------------------------------------------
    # CREATE USING CREDENTIAL REFERENCE
    # -------------------------------------------------------------------------

    - name: Fetch Azure credential object from XSOAR
      cortex.xsoar8.credential:
        provider: "{{ xsoar_provider }}"
        name: "{{ azure_credential_name | default('azure_sentinel_credential') }}"
        state: gathered
      register: azure_cred
      tags:
        - create_azure
        - gather_credential

    - name: Create Azure Sentinel integration using fetched credential ID
      cortex.xsoar8.integration:
        provider: "{{ xsoar_provider }}"
        name: "{{ azure_integration_name | default('Azure_Sentinel_Prod') }}"
        brand: "Azure Sentinel"
        enabled: true
        configuration:
          tenant_id: "{{ azure_tenant_id | default('your-tenant-id') }}"
          subscriptionID: "{{ azure_subscription_id | default('your-subscription-id') }}"
          resourceGroupName: "{{ azure_resource_group | default('your-rg') }}"
          workspaceName: "{{ azure_workspace | default('your-workspace') }}"
          # This key name is specific to Azure Sentinel.
          credentials:
            credential: "{{ azure_cred.credential.id }}"
        state: present
      register: azure_integration
      when: azure_cred.credential is defined
      tags:
        - create_azure

    - name: Report missing credential before create
      ansible.builtin.debug:
        msg: "{{ azure_cred.msg | default('Azure credential not found; integration create skipped') }}"
      when: azure_cred.credential is not defined
      tags:
        - create_azure

    - name: Display Azure integration result
      ansible.builtin.debug:
        msg: |
          Changed: {{ azure_integration.changed }}
          Message: {{ azure_integration.msg }}
      tags:
        - create_azure

    # -------------------------------------------------------------------------
    # GATHER
    # -------------------------------------------------------------------------

    - name: Gather Azure integration by name
      cortex.xsoar8.integration:
        provider: "{{ xsoar_provider }}"
        name: "{{ azure_integration_name | default('Azure_Sentinel_Prod') }}"
        state: gathered
      register: azure_info
      tags:
        - gather_azure

    - name: Display Azure integration details
      ansible.builtin.debug:
        msg: |
          Name   : {{ azure_info.integration.name }}
          ID     : {{ azure_info.integration.id }}
          Brand  : {{ azure_info.integration.brand }}
          Enabled: {{ azure_info.integration.enabled }}
      when: azure_info.integration is defined
      tags:
        - gather_azure

    - name: Display gather result when Azure integration is missing
      ansible.builtin.debug:
        msg: "{{ azure_info.msg | default('Azure integration details not available') }}"
      when: azure_info.integration is not defined
      tags:
        - gather_azure

    # -------------------------------------------------------------------------
    # DELETE
    # -------------------------------------------------------------------------

    - name: Delete Azure integration by name
      cortex.xsoar8.integration:
        provider: "{{ xsoar_provider }}"
        name: "{{ azure_integration_name | default('Azure_Sentinel_Prod') }}"
        state: absent
      register: delete_result
      tags:
        - delete_azure

    - name: Display delete result
      ansible.builtin.debug:
        msg: "{{ delete_result.msg }}"
      tags:
        - delete_azure
